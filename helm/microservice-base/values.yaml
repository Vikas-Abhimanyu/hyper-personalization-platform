replicaCount: 2

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

probes:
  livenessPath: /actuator/health
  readinessPath: /actuator/health

ingress:
  enabled: false
  className: alb
  host: ""
  scheme: internet-facing
  groupName: platform
  certificateArn: ""
  global:
  certificateArn: arn:aws:acm:ap-south-1:123456789012:certificate/xxxxxxxx

serviceAccount:
  create: true
  annotations: {}

externalSecret:
  enabled: false
  data: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

config:
  enabled: false
  data: {}

rbac:
  create: false
  rules: []

serviceMonitor:
  enabled: false
  path: /actuator/prometheus
  interval: 30s

topologySpread:
  enabled: true
  maxSkew: 1