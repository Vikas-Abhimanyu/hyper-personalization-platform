apiVersion: karpenter.sh/v1alpha5
kind: Provisioner
metadata:
  name: default
spec:
  requirements:
    - key: "node.kubernetes.io/instance-type"
      operator: In
      values: ["m7g.large", "m7g.xlarge"]
  limits:
    resources:
      cpu: 1000
      memory: 2000Gi
  providerRef:
    name: default
